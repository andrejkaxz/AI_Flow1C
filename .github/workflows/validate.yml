name: validate

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-capabilities/template-docx.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q flow1c scripts tests
      - name: Clean interview bootstrap and saved-gate update smoke
        run: python scripts/interview-smoke.py --bootstrap --output interview-smoke-evidence.json

  windows-templates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Clean bootstrap and legacy update smoke
        run: python scripts/template-smoke.py --bootstrap --output template-smoke-evidence.json
      - name: Resumable updater and index validation smoke (Windows PowerShell 5.1)
        run: python scripts/update-smoke.py --output update-smoke-evidence.json
      - name: Real CLI package update and preserved request (isolated clone)
        run: python scripts/modularization-smoke.py --baseline-ref 2eab99f --output modularization-smoke-evidence.json
      - run: python -m pip install -r requirements-dev.txt
      - name: Installed RLM zero-delta compatibility smoke (isolated source and cache)
        run: python scripts/index-compat-smoke.py --output index-compat-smoke-evidence.json
      - name: Clean interview bootstrap and saved-gate update smoke
        run: python scripts/interview-smoke.py --bootstrap --output interview-smoke-evidence.json
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q flow1c scripts tests
      - run: node --test --test-isolation=none tests/test_guard.mjs
      - run: node --test --test-isolation=none tests/test_opencode_runtime.mjs
