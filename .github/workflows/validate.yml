name: validate

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-templates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Clean bootstrap and legacy update smoke
        run: python scripts/template-smoke.py --bootstrap --output template-smoke-evidence.json
      - name: Resumable updater and index validation smoke (Windows PowerShell 5.1)
        run: python scripts/update-smoke.py --output update-smoke-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: updater-${{ runner.os }}
          path: update-smoke-evidence.json
      - name: Real CLI package update and preserved request (isolated clone)
        run: python scripts/modularization-smoke.py --baseline-ref 2eab99f --output modularization-smoke-evidence.json
      - name: Compact context coverage, process death and restart smoke
        run: python scripts/context-smoke.py --output context-smoke-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: context-${{ runner.os }}
          path: context-smoke-evidence.json
      - run: python -m pip install -r requirements-dev.txt
      - name: Installed RLM zero-delta compatibility smoke (isolated source and cache)
        run: python scripts/index-compat-smoke.py --output index-compat-smoke-evidence.json
      - name: Clean interview bootstrap and saved-gate update smoke
        run: python scripts/interview-smoke.py --bootstrap --output interview-smoke-evidence.json
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q flow1c scripts tests
      - name: Generated route projections
        run: python scripts/generate-route-projections.py --check
      - name: Completion handoff crash and restart smoke
        run: python scripts/handoff-smoke.py --output handoff-smoke-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: handoff-${{ runner.os }}
          path: handoff-smoke-evidence.json
      - name: Route catalog and structured baseline comparison (no model evaluation)
        run: python scripts/routing-smoke.py --integration --output routing-smoke-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: routing-contract-${{ runner.os }}
          path: routing-smoke-evidence.json
      - run: node --test --experimental-test-isolation=none tests/test_guard.mjs
      - run: node --test --experimental-test-isolation=none tests/test_opencode_runtime.mjs
